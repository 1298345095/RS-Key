# The authenticatorLargeBlobs write gate. It is a real authorization decision on
# a real permission bit, and the abstraction has no word for it: A carries mc/ga/
# cm/acfg and the generated Ops domain has no UseLbw. Named here so the axis is
# complete and the omission is a decision rather than a spelling.
[[outcome_producer]]
file = "crates/rsk-fido/src/largeblobs.rs"
function = "write_fragment"
disposition = "out-of-scope"
column = "largeblob-ext"
why = "gates on PERM_LBW, outside alpha's permission set; and CTAP 2.3 §12.4 makes the whole command unreachable in that column"
