[[cell]]
# The four images that remove the gate the statements are about.
properties = [
  "SEC-FIDO-001", "SEC-FIDO-002", "SEC-POL-004", "SEC-ADM-002",
]
columns = [
  "firmware-no-touch", "firmware-no-touch-pqc", "firmware-no-touch-fips",
  "firmware-no-touch-fips-pqc",
]
feature = "no-touch"
cfg = ["firmware/src/presence.rs"]
disposition = "out-of-scope"
basis = "gate-compiled-out"
why = """
`no-touch` replaces the button watcher with an instant auto-confirm \
(`firmware/src/presence.rs`), so the physical-consent gate these four \
statements are ABOUT is not in the image: "the live authorization its own gate \
requires", "a presence decision produced for one transport", "a confirmed \
physical press", "a Confirmed operator presence". The claim is not weakened \
here, it is not made — and the tree already treats these builds that way. None \
of the four is published, `firmware/Cargo.toml` says "Never ship a no-touch \
build", and `release-build.yml` refuses to create a release carrying one. \
"No-touch image" in the singular is the phrasing that hid four packages."""

# ---- Settling questions -----------------------------------------------------
#
# One per column that still carries a `gap` cell. Required: a gap with no
# question is a shrug with a verdict column, and it is the shape in which a
# whole axis goes unexamined for a year. No counts here on purpose — the
# generated page prints them, and a number written twice is a number that rots.

[[question]]
column = "firmware-no-touch"
text = """
Beyond the four presence statements: which rows depend on a presence decision \
only INDIRECTLY — a reset is reached through a touch, so does `SEC-FIDO-006`'s \
torn-reset argument still describe an image where the touch is instant?"""

[[question]]
column = "firmware-no-touch-pqc"
text = "As `firmware-no-touch`, plus: does advertising ML-DSA-44 in `getInfo` change any authorization path, or only the algorithm list?"

[[question]]
column = "firmware-no-touch-fips"
text = "As `firmware-no-touch`, plus the `fips-profile` question: the locked algorithm policy also raises the PIN floor, so which retry/gate properties are re-measured under it?"

[[question]]
column = "firmware-no-touch-fips-pqc"
text = "The union of the `firmware-no-touch`, `firmware-fips` and `firmware-pqc` questions; no evidence is measured on the three-feature combination at all."

[[question]]
column = "firmware-fips"
text = """
`fips-profile` changes `rsk-fido` and `rsk-piv` — the PIN policy and the \
permitted algorithm set. `check.sh` runs the `rsk-fido` and `rsk-piv` test \
suites under it, so the question is narrow: does any P0-family invariant's \
model take the PIN floor or the algorithm set as a parameter, and if so, was \
it re-checked at the profile's values?"""

[[question]]
column = "firmware-fips-pqc"
text = "As `firmware-fips`, on the combination with `advertise-pqc`; the pair is published and nothing measures the two features together."

[[question]]
column = "firmware-pqc"
text = "`advertise-pqc` only adds ML-DSA-44 to the `getInfo` algorithm list — is that the whole delta for every P0-family row, or does the larger credential/attestation path move with it?"

[[question]]
column = "firmware-strong-pin"
text = "A six-code-point floor and a trivially-guessable-PIN refusal. Does any P0-family statement quantify over PIN values, or do they all treat the PIN as an opaque secret whose policy is someone else's row?"

[[question]]
column = "firmware-strong-pin-pqc"
text = "As `firmware-strong-pin`, on the combination with `advertise-pqc`."

[[question]]
column = "firmware-always-uv"
text = """
`always-uv` ships `alwaysUv` ON, which changes what `SEC-FIDO-001`'s gate \
DEMANDS rather than whether it is enforced — and `SEC-FIDO-006B` is about the \
alwaysUv gate surviving a reset, with a compiled-in default this column moves. \
Do the model's gate constants cover the alwaysUv-on arm?"""

[[question]]
column = "firmware-always-uv-pqc"
text = "As `firmware-always-uv`, on the combination with `advertise-pqc`."

[[question]]
column = "firmware-strict-up"
text = "`strict-up` demands a touch on EVERY assertion, dropping the silent `up:false` pre-flight. That strengthens the gate — but `SEC-FIDO-002` is about presence decisions not crossing transports, and this column produces strictly more of them. Is the model's transport arity still the right one?"

[[question]]
column = "firmware-strict-up-pqc"
text = "As `firmware-strict-up`, on the combination with `advertise-pqc`."

[[question]]
column = "firmware-display"
text = """
This column is NOT `default + display`: it also sets `flashSize = 16M` and \
`ledKind = none`, and it re-routes user presence through the panel's \
Approve/Deny instead of the button. Each non-display row therefore has to \
answer three questions, not one — and the flash-geometry half is the same \
16 MB question the board axis carries. It reaches the three `SEC-DISP-*` rows \
too, which is why they are `gap` here and not `covered`: the ceremony's \
evidence — `formal/Display.cfg`, the `rsk-ui`/`rsk-display` host tests and the \
`check.sh` rows that compile the feature — was every bit of it produced at the \
DEFAULT 4 MB geometry, and no row in the tree builds `--features display` at \
`FLASH_SIZE=16M`. Either add that row, or say in a `conditional` what the \
ceremony claim is conditional on."""

[[question]]
column = "firmware-2mb"
text = """
2 MB with `KVMAIN` shrunk to 896 K. Do the store properties' models take the \
partition size as a parameter, and were they checked at the shrunk one? The \
scope floors in `formal/floors.txt` are about model constants, not about the \
device's own capacity."""

[[question]]
column = "firmware-16mb"
text = """
16 MB with the default 1408 K `KVMAIN`. This is the geometry on which a whole \
KV store survived a wipe the device reported as successful — so for every store \
and boot row the question is not "does the code differ" (it does not) but "was \
the evidence ever produced against this partition map"."""

[[question]]
column = "firmware-strict-config"
text = """
The largest feature delta in the tree: five crates, and it re-imposes the \
presence/PIN gates on device-config writes that the DEFAULT build leaves \
ungated. `SEC-ADM-002` and `SEC-ADM-004` are about exactly that surface, so \
this column is the one where their disposition may be STRONGER than the \
default's — which the matrix has no way to say until someone measures it."""

[[question]]
column = "keygen-bench"
text = """
A debug vendor command (INS 0x13) that `firmware/Cargo.toml` says never to \
ship, and it exposes a timing oracle over the primality primitives. Is a \
never-shipped measurement build inside the supported configuration set at all? \
That is a maintainer ruling, not a derivation — and the four `no-touch` \
packages answer it the other way, so it cannot be assumed."""

[[question]]
column = "core1-stats"
text = "As `keygen-bench`: INS 0x12 exposes per-core candidate/find rates, which time the RSA keygen prime search. Same unresolved question about never-shipped measurement builds."

[[question]]
column = "bench"
text = "As `keygen-bench`, and it is the one of the three that also pulls a crate (`rsk-bench`) into the image, so the answer cannot be inherited from the other two."

[[question]]
column = "fido-conformance"
text = "Built only for the FIDO Conformance Tool run: it suppresses the EdDSA advertisement. Does any P0-family row depend on the advertised algorithm list — and is a conformance-only build in the supported set?"

[[question]]
column = "ea-conformance-rpid"
text = "Adds the conformance tool's RPID to the vendor-facilitated enterprise-attestation list, which is an authorization-relevant allowlist. `SEC-FIDO-001` is about gates; is an EA RPID list one of them?"

[[question]]
column = "largeblob-ext"
text = """
The sharpest orthogonal feature: it serves the CTAP 2.3 `largeBlob` extension \
INSTEAD OF the 2.1 `largeBlobKey` + `authenticatorLargeBlobs` pair (the spec \
forbids both), it carries four `check.sh` rows, and it has zero flake packages \
— so nothing in the release axis would ever have given it a cell. Does the \
swapped surface move any credential-management or authorization transition the \
P0-launch models name?"""

[[question]]
column = "abrobot-16m"
text = "The 16 MB geometry question of `firmware-16mb`, plus a GPIO presence source instead of BOOTSEL."

[[question]]
column = "abrobot-4m"
text = """
The narrowest column with anything open, and both open groups are the same \
question: does a GPIO button on 23 (active-low) deliver the Confirmed/Cancelled \
semantics the presence model assumes of BOOTSEL — same debounce, same \
cancellation, same per-transport arbitration? Four rows name presence directly; \
the four reset clauses are reached through it."""

[[question]]
column = "seeed-xiao"
text = "2 MB with `KVMAIN` at 896 K — the `firmware-2mb` question on a board that also gates the LED behind a power pin."

[[question]]
column = "tenstar-usb"
text = "The 16 MB geometry question, plus a GPIO presence source on 15."

[[question]]
column = "waveshare-touch-lcd"
text = """
The trusted-display BOARD without the `display` feature: 16 MB geometry, no \
addressable LED, and panel pins compiled as inert constants. The geometry \
question is `firmware-16mb`'s. The sharper half is now measured rather than \
asked: this preset IS buildable without `--features display` — `build.rs` \
parses the `[display]` keys with no `CARGO_FEATURE_DISPLAY` gate — and nothing \
in `check.sh` builds `firmware` on it at all. The board loop builds `rsk-wipe`, \
and both `BOARD=` firmware rows pin `waveshare-one`. So the column is real and \
WHOLLY UNEXERCISED, and what is left to decide is whether the tree should build \
it, or whether it should be a knob of `firmware-display` instead."""
