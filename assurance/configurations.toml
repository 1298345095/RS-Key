and because the delta carries the VALUES, a preset that drifts off one of those \
defaults stops earning it."""

[[cell]]
# Default flash geometry; the deltas are the LED and the presence SOURCE.
properties = [
  "SEC-FIDO-003", "SEC-FIDO-004", "SEC-FIDO-005", "SEC-FIDO-007",
  "SEC-FIDO-008", "SEC-STORE-001", "SEC-STORE-002", "SEC-STORE-003",
