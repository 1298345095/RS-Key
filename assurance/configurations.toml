  "SEC-FIDO-005", "SEC-FIDO-006", "SEC-FIDO-006A", "SEC-FIDO-006B",
  "SEC-FIDO-006C", "SEC-FIDO-007", "SEC-FIDO-008", "SEC-STORE-001",
  "SEC-STORE-002", "SEC-STORE-003", "SEC-STORE-004", "SEC-STORE-005",
  "SEC-STORE-006", "SEC-LAT-001", "SEC-LAT-002", "SEC-LAT-003",
  "SEC-POL-001", "SEC-POL-002", "SEC-POL-003", "SEC-POL-004", "SEC-POL-005",
  "SEC-POL-006", "SEC-SEAM-001", "SEC-SEAM-002", "SEC-SEAM-003",
  "SEC-SEAM-006", "SEC-ADM-002", "SEC-ADM-004", "SEC-BOOT-001",
  "SEC-BOOT-002", "SEC-TRANS-001", "SEC-TRANS-002", "SEC-TRANS-003",
]
columns = ["waveshare-one"]
same_as = "firmware"
knob_delta = [
  "flash.kvmain_kb=1408", "flash.size_mb=4", "led.kind=ws2812",
  "led.order=rgb", "led.pin=16", "presence.source=bootsel",
  "usb.vidpid=RSKey",
