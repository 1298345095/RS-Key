same_as = "firmware"
knob_delta = [
  "flash.kvmain_kb=1408", "flash.size_mb=4", "led.kind=ws2812",
  "led.max_leds=4", "led.order=grb", "led.pin=16",
  "presence.active_high=False", "presence.pin=23", "presence.source=gpio",
