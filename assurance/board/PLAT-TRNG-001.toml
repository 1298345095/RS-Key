#
# Every key, nonce, blinding factor and pinUvAuthToken rests on it. A
# statistical test of the WHITENED output is not this measurement: whitening
# passes over a stuck source, which is the whole failure mode.

assumption = "PLAT-TRNG-001"
method = "Read the RAW ring-oscillator source before whitening, on a known stepping, at the supply and temperature corners the RP2350 datasheet qualifies. The boot health check was raised from 25 to 1000 samples after a stall was measured, so the check's own margin is part of what is being measured."
boot_config = "A build that exposes the raw source — this tree does not ship one, so the measurement needs a bench image and its hash recorded here like any other."
expected = "Full entropy per word at every qualified corner, and the boot health check rejects a stuck source within its 1000 samples. PASS = min-entropy at or above the datasheet figure. FAIL = any corner where the raw source degrades and the health check still passes, which would make every key on the device predictable to whoever knows the corner."
outcome = "planned"
board = ""
stepping = ""
firmware_sha256 = ""
