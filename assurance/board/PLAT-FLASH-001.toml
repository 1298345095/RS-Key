#
# The store's crash-consistency envelope rests on this and on nothing else: a
# torn program leaves the old record or a detectably bad one, never a plausible
# wrong one. It is the row that blocks stage 5's exit.
#
# The first version of this record claimed the script sweeps offsets. It does
# not: tests/29_reset_power_cut.py takes ONE delay (`RSK_POWER_CUT_DELAY_MS`,
# default 25 ms) and performs ONE cut per run, and its assertions are about the
# post-cut getInfo, the old credential refusing without a gate, the backup state
# and the owner seed -- it never reads a store record back and classifies it.
# So the sweep is part of the METHOD a person has to perform, not something the
# script does, and the classification is a second instrument this row still owes.
assumption = "PLAT-FLASH-001"
method = """`python tests/29_reset_power_cut.py` against a throwaway board with a REAL supply cut -- not `picotool reboot` and not a watchdog reset, neither of which stops the flash array mid-program. One run is one cut at one delay, so the sweep is the operator's: repeat over `RSK_POWER_CUT_DELAY_MS` across the program window, and record every delay tried, including the ones that landed outside it."""
boot_config = """The DEFAULT image with its partition table applied, on a 4 MB board. The 16 MB geometry is a separate cell of docs/assurance-matrix.md and a 4 MB run does not cover it."""
expected = """Every interrupted write leaves the record readable as the OLD value or refused as corrupt. PASS = old-or-refused at every delay tried, with the delays listed. FAIL = one record that reads back as a well-formed value nobody wrote, which falsifies the store model outright. INCONCLUSIVE = no delay landed inside the program window, which the script cannot tell you on its own -- it asserts about the device after the cut, not about the record's bytes, so classifying the record is a second instrument this row still owes."""
outcome = "planned"
board = ""
stepping = ""
firmware_sha256 = ""
first_boot_capture = ""
actual = ""
note = """A RUN HAPPENED on 2026-09-04 and it does NOT discharge this row; both halves of that are worth the record. WHAT IT ESTABLISHES: `tests/29_reset_power_cut.py` was driven against the board with a real supply cut and printed PASS -- the transcript is assurance/board/PLAT-FLASH-001-2026-09-04-powercut.log beside this file. The cut landed inside the wipe, and the tell is the shape of the failure rather than a timeout: the RESET sender came back `OSError('read error')`, a USB handle that died under it. Across the reboot the device was fail-closed on every axis the script reads -- `clientPin=True alwaysUv=True sealed=True` -- and the pre-cut resident credential answered `0x36`. So `expected`'s FAIL, a record reading back as a well-formed value nobody wrote, did not occur. WHY IT IS NOT A DISCHARGE, in this record's own words: `method` puts the sweep on the operator -- repeat over `RSK_POWER_CUT_DELAY_MS` across the program window and record every delay tried -- and a hand sets no delay at all, because that variable is read only in the `RSK_POWER_CUT_CMD` branch. A manual cut is one sample at an unknown latency, `expected` asks for the delays LISTED, and nothing in the script timestamps the tear, so even this one cannot be listed. `expected` names the other gap itself: the script asserts about the DEVICE after the cut, not about the record's bytes, so telling old-or-refused from a plausible value nobody wrote is a second instrument this row still owes and this tree does not have. Two instruments, then, before a relay is even the binding constraint. MEASURED BESIDE IT, because a first attempt returned INCONCLUSIVE and the reason was not the operator: the manual arm prints `>>> CUT POWER NOW <<<` AFTER starting the RESET thread, so the window a hand must hit is the whole duration of `authenticatorReset` on the wire. That is 487.2 ms on this board (assurance/board/PLAT-FLASH-001-2026-09-04-window.log) -- reachable, but only if the yank rides the Enter press instead of the printed line, which is not what the prompt says. The 25 ms in the script is the relay's default delay, and it was mistaken for the window once already in this session, by inference rather than measurement."""
