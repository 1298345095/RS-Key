#
# Which threat each registered property is against. `docs/threat-model.md` is the
# root of the evidence chain every assurance claim here hangs from, and it was
# cited by exactly one word — the file name — on 33 rows of
# `assurance/properties.toml`. "This property is against the threat model" names
# no threat: a property with no clause behind it is either mis-scoped or
# unnecessary, and neither was visible.
#
# A CLAUSE is one addressable unit of that page: any heading, or any list item.
# That set is DERIVED by `scripts/threat_gate.py` straight from the markdown,
# and this file must name every unit exactly once — so a new bullet arrives as a
# clause nobody classified rather than as prose nothing traces to. What cannot be
# derived is the naming and the judgement, and that is all this file holds:
#
#   id     the stable name a `source` entry cites, as `docs/threat-model.md#ID`.
#          It is a registry id, NOT a rendered anchor — the page carries no HTML
#          anchors and gains none for this. Renaming one is a two-file edit.
#   where  the clause's FIRST LINE, verbatim. It is a content lock, not a line
#          number: text moves down the page without rotting it, and a reworded or
#          deleted clause goes red. What it does NOT see is a rewrite BELOW that
#          first line — the same blind spot `formal/citations.lock` has, kept
#          because this page's first line is its thesis while its body is edited
#          constantly: 39 clause bodies changed with their first line intact over
#          this page's history against 12 first lines reworded, so a lock over the
#          whole body would have fired on 24 of its 30 commits and been suppressed
#          like any other alarm that is usually noise. `rests_on` is the narrow
#          lock for the sentences that could not afford to be under it.
#   kind   `defence` — the page states a defence or a defended threat here, so a
#          property may serve it; `context` — assets, an out-of-scope
#          declaration, a stated residual, a third-party result, a process. A
#          `context` clause cannot be cited: "serving" the asset list is not a
#          claim. Each carries the `why` in one sentence.
#   rests_on
#          the sentences UNDER a first line that some verdict argues FROM, held
#          against the body of the clause they belong to. Whitespace-normalised,
#          so a re-wrap is not a rewrite and a reword still is. Which ones are
#          owed is READ OFF the tree rather than remembered — an `[[untraced]]`
#          whose `why` names a clause id owes a pin inside that clause, and a
#          clause whose body hands part of its claim to a `PLAT-…` assumption
#          owes one on the sentence naming it — so a new dependency arrives owing
#          a pin instead of arriving unlocked. What it cannot reach: a sentence
#          load-bearing for a reason no entry here states.
#
# WHEN A PROPERTY TRACES — one rule, written down because leaving it implicit is
# what let two entries below contradict each other in a first draft. A property
# traces to a clause when that clause states the THREAT it defends against, even
# where the clause's list of examples does not name its applet; it is untraced
# when the page states no such threat in any form. So `SEC-POL-005` traces to
# `TM-HOST-GATES` (an access secret guarding a privileged mutation IS that
# clause, though its enumeration lists OATH and PIV and no OTP) while
# `SEC-POL-006` does not (replay of an emitted OTP is not a gate, and nothing on
# the page states it). The enumeration gap is a docs finding of its own, not the
# reason for a verdict.
#
# The `[[untraced]]` half is the finding, not a blank. A P0-family property with
# no clause means one of exactly two things and has to say which: `missing-clause`
# (the page does not state a threat this tree defends against) or
# `defends-nothing` (the property is against nothing). Seven rows are here, and
# FOUR of them name the same absent clause: the page states no power-interruption
# threat, though the whole store tranche is against one.

