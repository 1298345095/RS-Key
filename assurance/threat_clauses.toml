[[untraced]]
id = "SEC-FIDO-005"
verdict = "missing-clause"
why = """
no clause says the owner must be able to see and revoke every credential \
the device holds; the property exists because a torn makeCredential can \
strand one outside credential management, and that capability is nowhere \
on this page"""

[[untraced]]
id = "SEC-STORE-001"
verdict = "missing-clause"
why = """
the page states no power-interruption threat, though a host can cut USB \
power at a chosen instant; a torn delete leaving metadata over a removed \
value is that attacker's state, and the whole RSKeyStore module exists for \
it"""

[[untraced]]
id = "SEC-STORE-003"
verdict = "missing-clause"
why = """
same missing power-interruption clause: a torn meta_add dropping another \
FID's committed record is integrity loss under an attacker-chosen cut, and \
the page has no integrity clause for the store at all"""

[[untraced]]
id = "SEC-STORE-004"
verdict = "missing-clause"
why = """
the same absent clause one layer in: this is the EF_META lemma the metadata \
rows rest on, and the attacker it is ultimately against is the timed power \
cut SEC-STORE-003 names, which the page does not state"""

[[untraced]]
id = "SEC-STORE-005"
verdict = "missing-clause"
why = """
the same absent clause and the same lemma role: CacheHonest is the induction \
conjunct that makes a rebuild-from-empty safe under a timed power cut, which \
is the threat the page does not state"""

[[untraced]]
id = "SEC-POL-003"
verdict = "missing-clause"
why = """
no clause covers key material surviving a slot's re-parameterisation; an \
OpenPGP key left standing under a changed algorithm attribute is a live \
secret behind a label that no longer describes it"""

[[untraced]]
id = "SEC-POL-006"
verdict = "missing-clause"
why = """
a repeated counter lets a captured OTP validate twice, and the page states \
no replay threat in any form — the Yubico OTP applet appears on it nowhere, \
not as a surface and not among the gates"""
