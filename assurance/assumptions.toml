#
# Standing assumptions: facts a model uses that the model itself cannot
# establish. HAND-WRITTEN FIELDS ONLY: constant, statement, discharged_by, risk.
# Which configurations pin an assumption, which arm each takes, and whether the
# module branches on it at all are DERIVED by scripts/assumption_gate.py and
# printed, never stored — the same rule properties.toml states, for the same
# reason.
#
# The gate holds this file against the tree in both directions, and its third
# rule is the one that earned the file. `PowerOnClearsScratch2` was an
# `ASSUME` in RSKeyBootHardening and `TRUE` in all seven Boot configurations,
# and nothing branched on it: deleting the line left every run bit-identical
# (77 states, 24 distinct, depth 5, before and after). It named the open
# question without letting anyone ask it. So an assumption must be ASSIGNED
# BOTH WAYS by some configuration and READ BY AN ACTION, or it is a comment
# with a type.

[[assumption]]
constant = "PowerOnClearsScratch2"
statement = "A real RP2350 power-on reset clears WATCHDOG.scratch2, so the PIN soft-lock the previous cycle recorded does not ride through it."
discharged_by = "A board measurement: write a known value to WATCHDOG.scratch2, cut power at the supply (not a warm reset — firmware/src/pin_lock.rs:54 writes the word on every CBOR dispatch, so the read must come from the first boot after), and read it back on the next boot. tests/54_sram_residue.py is the shape; the register is not SRAM, so it needs its own probe."
# Which way an unconfirmed assumption fails matters more than that it is
# unconfirmed, and this one fails towards MORE locking, not less: a word that
# rides a power cycle carries the mismatch batch with it. The undefined-register
# case is a third possibility and is already handled — the tag makes garbage read
# as clear (firmware/src/pin_lock.rs:36-37) — so it is not this assumption's.
risk = "usability"

[[assumption]]
constant = "AlwaysUvShipped"
statement = "The shipped image is built without `--features always-uv`, so `gate.alwaysUv` is a free state variable a platform toggles rather than the compiled default every reset restores."
discharged_by = "The build itself: `firmware/Cargo.toml`'s default feature set, and the `firmware-always-uv` column of docs/assurance-matrix.md, whose settling question already names SEC-FIDO-001. Both arms run: every configuration the shipped image is about pins it FALSE, and AlwaysUv.cfg runs the whole invariant set with it TRUE."
# Which way it fails: TOWARDS more gating. A build that ships alwaysUv demands a
# token for every makeCredential and getAssertion, so the arm the shipped tree
# does not take is the stricter one — a coverage question, not a security one.
risk = "coverage"

[[assumption]]
constant = "WidePerms"
statement = "The five permission subsets `PermSets` carries are enough: the eleven a host can also obtain reach no state the five do not."
discharged_by = "Both arms run. FALSE in every configuration the tiers are about, TRUE in PermWide.cfg, which draws `ps` from all sixteen subsets of `Perms` and checks the whole invariant set. The narrow arm was never a description of the code and is no longer claimed to be one: driving `client_pin` over all 256 requestable permission bytes on both permission-bearing subcommands (crates/rsk-fido/src/clientpin_perms_tests.rs) obtains ALL SIXTEEN, because 0x09 refuses only `be` and a `pcmr` travelling with company. What the wide arm discharges is the consequence, not the premise."
# Which way it fails: COVERAGE, and only coverage. A subset the model never
# builds is a permission combination no configuration runs -- it cannot make an
# invariant hold that would otherwise break, it can only hide a break. That is
# why the arm exists rather than an argument, and why it is a separate
# configuration: measured, widening Shipped.cfg's own scope costs x4.16 wall.
risk = "coverage"

[[assumption]]
constant = "ForceChangeModelled"
statement = "`gate.forceChange` — EF_MINPINLEN[1], the forced-PIN-change flag — is a gate the module can leave out of the configurations the tiers are about, because a state it can only PRUNE reaches no violation the tiers would otherwise see."
discharged_by = "Both arms run. FALSE in every configuration the tiers are about, TRUE in ForceChange.cfg — which sets the flag from authenticatorConfig and checks the whole invariant set — and in the two configurations of `BugForceChangeIgnored`, whose defect is unreachable on the FALSE arm by construction. The FALSE arm is an ARGUMENT and is written as one: adding a record field that is constant FALSE for a whole run is a bijection on reachable states, so the arm can add no behaviour. The argument is then CHECKED, and not by this sentence: the safety tier re-run after the constant landed carries the same states, the same distinct count and the same depth for `Shipped.cfg`, `AlwaysUv.cfg` and `PermWide.cfg` as the record taken before it existed. Those numbers live in `formal/runs.toml` and in the generated results table, which is where they are read off — an earlier draft of this sentence claimed the measurement in the past tense before any run had finished, and a review caught it by comparing file times. PLAT-MODEL-010 is the row this closes: `crates/rsk-fido/src/clientpin.rs:380-386` refuses token issuance after the PIN has verified, and the module carried three conjuncts where the code has four."
# Which way it fails: COVERAGE. The flag only ever DISABLES an issuing door, so a
# configuration that cannot set it explores a superset of the token-issuing
# behaviours -- it can hide no break, only pay for states that prove nothing. The
# arm exists rather than an argument because the flag is reachable from every
# PIN-set state, and Shipped.cfg already pays 77 563 872 distinct states.
risk = "coverage"
