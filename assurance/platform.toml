#
# The SECOND assumption registry: the ones no model constant can carry.
#
# `assurance/assumptions.toml` holds a Boolean TLA constant some configuration
# assigns both ways and some reachable definition reads. That shape is what makes
# a model assumption falsifiable — you discharge it by running the other arm —
# and it refuses everything here by construction: `M7-Q2` written there answers
# `in the registry but no configuration assigns it`, and so does a recorded board
# PASS, and so does `tools/emu` fidelity. A second FILE rather than a `class`
# field on the first, because the field would be a hand-written discriminator
# choosing which rules apply: measured, deleting `PowerOnClearsScratch2` from the
# first registry reddens it in one line, and a `class = "platform"` on that same
# entry would leave the orphan rule satisfied and the both-arms rule skipped.
#
# HAND-WRITTEN FIELDS ONLY: id, statement, class, discharge, discharge_owner,
# status, failure_direction, and the link lists. Which candidates exist is
# DERIVED by scripts/platform_gate.py from four sources and printed, never
# stored — the same rule properties.toml states, for the same reason.
#
# Read the `status` column first. **Two of thirty-three are discharged**, and
# both were discharged by reading — a manifest, and a model against the code it
# abstracts. Nothing here is evidence about a board yet; every other row is an
# obligation with an owner and a named route, and the routes that end at a board
# this repository must not touch are exactly the rows whose `discharge_owner` is
# `maintainer` — a count the generated page derives, and the same expression that
# decides which rows owe a record under `assurance/board/`.

# ---- Reset and the boot ROM --------------------------------------------------

[[assumption]]
id = "PLAT-RESET-001"
class = "reset"
statement = "A real RP2350 power-on reset clears `WATCHDOG.scratch2`, so the PIN soft-lock the previous cycle recorded does not ride through it."
discharge = "A board measurement: write a known value to WATCHDOG.scratch2, cut power at the supply — not a warm reset, because firmware/src/pin_lock.rs writes the word on every CBOR dispatch, so the read must come from the first boot after — and read it back. tests/54_sram_residue.py is the shape; the register is not SRAM, so it needs its own probe."
discharge_owner = "maintainer"
status = "pending"
# Towards MORE locking, not less: a word that rides a power cycle carries the
# mismatch batch with it. The undefined-register case is a third possibility and
# is already handled — the tag makes garbage read as clear.
failure_direction = "usability: a soft lock that outlives the power cycle it was meant to end"
covers = ["slice:AS-AUTH-4", "model:PowerOnClearsScratch2"]
discharges = ["PowerOnClearsScratch2"]
# `TheWholeLockRides` and not `MarkerNeverLies`: the marker is `EF_HARDENED`, a
# flash record, and nothing about it rides the watchdog word.
supports = ["SEC-BOOT-002"]

[[assumption]]
id = "PLAT-ROM-001"
class = "boot-rom"
statement = "M7-Q2: the boot ROM's BOOTSEL return path leaves `WATCHDOG.scratch2` as the firmware left it, so a drop to the bootloader is not a way to shed the soft lock."
discharge = "A board measurement on the same rig as PLAT-RESET-001, with the vendor applet's reboot-to-BOOTSEL in place of the supply cut, and the read taken on the boot after the bootloader is left. No datasheet clause states it either way; a vendor erratum would settle it as well."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a host that can reach the vendor AID could clear a soft lock the retry ladder imposed"
# The measurement cannot be taken until the drop itself is known to work, which
# is the other row's whole content.
depends_on = ["PLAT-ROM-002"]
supports = ["SEC-BOOT-002"]

[[assumption]]
id = "PLAT-ROM-002"
class = "boot-rom"
statement = "The vendor applet's reboot really reaches the bootloader: `tests/51_secure_reboot.py` has no runner in this tree, because the emulator has no bootloader to fall into."
discharge = "A run of `tests/51_secure_reboot.py --bootsel` against a no-touch board — the plain run drives P1=0x00, the warm reset, and only `--bootsel` takes the P1=0x01 path this row is about; afterwards the board needs a UF2 re-dragged. The capture belongs under assurance/board/."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "availability: a reboot that lands nowhere leaves a key that cannot be updated in the field"
covers = ["board-only:51_secure_reboot"]
supports = ["SEC-ADM-001"]

[[assumption]]
id = "PLAT-MEM-001"
class = "memory"
statement = "SRAM does not survive the drop to BOOTSEL, so a seed unwrapped in RAM is not readable through the bootloader."
discharge = "A re-run of `python tests/54_sram_residue.py control`, keeping what the 2026-08-05 run did not. That run reached the good outcome — tests/54_sram_residue.py:48 — and cannot discharge this row for two reasons, both in assurance/board/PLAT-MEM-001.toml: nobody kept the sha256 of the image it ran on, and the outcome it reached is the script`s `settled` (exit 3), which is defined as SETTLED WITHOUT THE SCAN, so `residue` never ran and neither `present` nor `absent` was measured. The earlier wording of this route said the only thing missing was the capture; that was wrong on both counts."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a plaintext seed readable over the bootloader's mass-storage interface"
depends_on = ["PLAT-ROM-002"]
# `slice:AS-RAM-6` and not a row of its own: the slice's assumption IS this
# statement — a copy the code can no longer reach satisfies the seed-ordering
# invariant whatever the memory holds — and a second entry would be two answers
# about one measurement.
covers = ["board-only:54_sram_residue", "slice:AS-RAM-6"]
supports = ["SEC-FIDO-007"]

