[[assumption]]
id = "PLAT-CRYPTO-001"
class = "crypto-primitive"
statement = "The HMAC-SHA-256 under `pinUvAuthProtocol` is correct as a MAC; the harnesses replay one concrete tag and say nothing about it."
discharge = "rsk-crypto's own vectors, and the soft backends the Kani rows force. A primitive's correctness is a different obligation from the protocol's, and this row exists so that the second does not read as the first."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: a forgeable tag makes every token check vacuous"
covers = ["slice:TCB-2"]
supports = ["SEC-FIDO-001"]

# ---- Build configuration, threat model, model abstraction --------------------

[[assumption]]
id = "PLAT-BUILD-001"
class = "build-configuration"
statement = "The shipped image is built without `--features always-uv`, so `gate.alwaysUv` is a free state variable a platform toggles rather than the compiled default every reset restores."
discharge = "The build itself: firmware/Cargo.toml's default feature set does not name it, and docs/assurance-matrix.md carries the firmware-always-uv column separately. Both arms run — every configuration the shipped image is about pins the constant FALSE, and AlwaysUv.cfg runs the whole invariant set with it TRUE."
discharge_owner = "contributor"
status = "discharged"
evidence = ["firmware/Cargo.toml", "docs/assurance-matrix.md"]
revalidated_by = "any change to firmware/Cargo.toml's [features] default set, or a new flake package building the firmware with a different one"
failure_direction = "coverage: the arm the shipped tree does not take is the STRICTER one — a token for every makeCredential and getAssertion"
covers = ["slice:AS-AUTH-2", "model:AlwaysUvShipped"]
discharges = ["AlwaysUvShipped"]
supports = ["SEC-FIDO-001"]

[[assumption]]
id = "PLAT-BUILD-002"
class = "build-configuration"
statement = "`ea-conformance-rpid`'s enterprise-attestation allowlist is a conformance fixture and not an authorization gate, so the authorization properties are unchanged in that column."
discharge = "The settling question docs/assurance-matrix.md already carries for that column, answered against the two production sites that read the allowlist."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: if it IS a gate, the matrix cell for that column is a gap and not an equivalence"
covers = ["slice:AS-AUTH-8"]
supports = ["SEC-FIDO-001"]

[[assumption]]
id = "PLAT-THREAT-001"
class = "threat-model"
statement = "A CTAPHID channel id is a routing label the sender writes, so channel ownership is a scoping rule and never an authentication one."
discharge = "A clause in docs/threat-model.md, which assurance/threat_clauses.toml would then derive. crates/rsk-fido/src/state.rs states it in prose beside the walk owner today, which is the wrong place for a threat-model premise."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security in the reading direction: a reader who takes channel ownership for authentication overestimates what the transport properties promise"
covers = ["slice:AS-AUTH-3"]
supports = ["SEC-FIDO-001", "SEC-FIDO-002", "SEC-TRANS-001"]

[[assumption]]
id = "PLAT-MODEL-001"
class = "model-abstraction"
statement = "`PermSets` — five of the sixteen permission subsets — is the set a host can actually obtain."
discharge = "Reading the two production sites that mint permissions. It is argued in the module today, not measured, and stage 2 п.7 owns the choice between symmetry, a wider finite domain and a separate source obligation."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: an obtainable subset outside the five is a permission combination no configuration ever runs"
covers = ["slice:AS-AUTH-5"]
supports = ["SEC-FIDO-001"]

[[assumption]]
id = "PLAT-MODEL-002"
class = "model-abstraction"
statement = "One credential per relying party is enough to carry the authorization and management properties; the shipped cardinality is `MAX_RESIDENT_CREDENTIALS`."
discharge = "The store slice of stage 5, which is where a cardinality argument can be made rather than assumed."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: a defect that needs two credentials of one RP — the enumerate/delete interleavings — is outside every configuration"
covers = ["slice:AS-AUTH-6"]
supports = ["SEC-FIDO-001", "SEC-FIDO-005"]
