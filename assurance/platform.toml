[[assumption]]
id = "PLAT-TOOLCHAIN-001"
class = "toolchain"
statement = "The compiler on the path is the pinned rustc and its output is what the proofs are about; Kani proves over MIR, not over the emitted image."
discharge = "Stage 11's source-to-binary work. Nothing in the tree bridges MIR to the image today, and saying so is the whole content of this row."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: a miscompilation is invisible to every proof this tree runs"
covers = ["slice:TCB-1"]

[[assumption]]
id = "PLAT-TOOLCHAIN-002"
class = "toolchain"
statement = "Every `unsafe` in the first-party tree upholds an invariant the compiler cannot check, and docs/unsafe.md is the enumeration of them."
discharge = "A source audit per site, which docs/unsafe.md carries: justification, why a safe alternative does not work, and how the risk is contained. A new site owes that page an entry before this row can be said to cover it."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: the one class of memory-corruption defect safe Rust does not rule out"
