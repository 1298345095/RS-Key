[[assumption]]
id = "PLAT-MODEL-001"
class = "model-abstraction"
statement = "`PermSets`'s five subsets are a SCOPE and not a description: a host can obtain all sixteen, and the missing eleven are covered by `WidePerms`'s other arm rather than by the claim that they cannot arise."
discharge = "Two halves, and stage 2 п.7's choice between symmetry, a wider finite domain and a separate source obligation is answered by taking the last two. (1) The domain: `WidePerms = TRUE` in PermWide.cfg draws `ps` from `SUBSET Perms` and checks the whole invariant set -- GREEN, so the eleven reach no violation at that scope. Symmetry was not taken: `ConfigGuard` names `\"acfg\"` and `OpGuard` is called with `\"mc\"`/`\"ga\"`, so a permutation of `Perms` is not a symmetry of this spec, and the wide arm made the question moot at a measured 493 s. (2) The alphabet: `be`, `lbw` and `pcmr` are not elements of `Perms` at all and the 0x09/0x06 admission rules over them are cross-bit, so no widening of a four-element `Perms` can express them -- that half is a source obligation, the exhaustive 512-case sweep in crates/rsk-fido/src/clientpin_perms_tests.rs, which also measured the 48 cases where the shipped path and CTAP 2.1 §6.5.5.7.2 disagree."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: an obtainable subset outside the wide arm's scope is a permission combination no configuration runs"
covers = ["slice:AS-AUTH-5", "model:WidePerms"]
discharges = ["WidePerms"]
supports = ["SEC-FIDO-001"]

[[assumption]]
id = "PLAT-MODEL-009"
class = "model-abstraction"
statement = "`EF_MINPINLEN`'s FLOOR (byte 0) and its RP-id disclosure list (bytes 2..) are outside `RSKeySecurityState` because neither can admit an operation: the floor is read only where a NEW PIN verifier is written and by `setMinPINLength`'s own monotonic guard, and the list is read only to disclose the floor to a listed RP. A floor that reads too low stores a weaker PIN of the owner's own choosing; it never authorizes a request. Byte 1, `forceChangePin`, is NOT covered by this argument — it refuses token issuance after a correct PIN, and belongs in the model."
discharge = "A source audit of the `EF_MINPINLEN` read sites, re-run when one is added: `git grep -n 'min_pin_length\\|current_min_pin\\|rp_min_pin_len\\|EF_MINPINLEN' -- crates`, checking that no new site sits on a grant path. The argument holds per BYTE, so a reader of byte 1 is a different question and this row does not cover it."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: a new reader on a grant path makes an unmodelled record decide an authorization, and no configuration goes red"
supports = ["SEC-FIDO-001", "SEC-FIDO-003"]

[[assumption]]
id = "PLAT-MODEL-010"
class = "model-abstraction"
statement = "`EF_MINPINLEN`'s `forceChangePin` byte IS a gate: `clientpin.rs` refuses `getPinToken` with `PinInvalid` and both permissions-based doors with `PinPolicyViolation` when it is set, AFTER the PIN has verified. `PinAttemptEnabled` and `PinAttemptPolicy` carried three conjuncts where the code has four, so a defect that waives the pending change was a live token the model could not see — and one has shipped (bcd 0x09AE)."
discharge = "Modelled, and THREE of the four sentences the route this replaces wrote were wrong — each found by review, none by a gate. `gate.forceChange` is set by ConfigOp (config.rs:483 refuses it without a PIN) and cleared by changePIN. It is NOT cleared by setPIN: `store_new_pin` (clientpin.rs:945-969) touches no EF_MINPINLEN byte, and the route's `cleared by both PIN writes (store_new_pin, clientpin.rs:1260)` was wrong twice over — :1260 is inside `store_local_pin`, the panel flow, which this module has no action for. Setting the flag also ENDS the session token and the persistent grant (config.rs:500-503); the first model had them `UNCHANGED`, which is the shipped tree carrying its own defect at the third of three sibling sites. The route also promised the code twin `already exists in the suite`; it did not, and was built here (formal/comutants.toml [BugForceChangeIgnored], phase2_count 30 -> 31) and killed. What held: `BugForceChangeIgnored` drops the guard and goes RED on `NoAuthorizationBypass` at depth 8 in both configurations, and the counterexample is a token ISSUED over a standing gate, not a refusal wearing another code. ForceChange.cfg is GREEN over 106 956 959 states, 10 765 176 distinct, depth 46, 178 s."
discharge_owner = "contributor"
status = "discharged"
evidence = ["formal/RSKeySecurityState.tla", "formal/ForceChange.cfg", "formal/comutants.toml"]
revalidated_by = "a new reader or writer of EF_MINPINLEN[1]: the model carries the flag at the two get_pin_token doors, the changePIN clear and the reset sweep, and `git grep -n 'force_change_pending\\|clear_force_change' -- crates` is the list it is held to — a fourth site, or a second clear, unsettles it"
failure_direction = "security: the model proves the authorization invariants over a state space with one gate fewer than the firmware has"
# WHAT IS STILL NARROWER, said here rather than left to be discovered. (1) The
# configurations the tiers are about run with `ForceChangeModelled = FALSE`, so
# Shipped.cfg still explores the space without the flag — registered as a
# coverage assumption with both arms run, not as an omission. (2) No clause names
# the record, so a torn reset that drops it early is unobserved; `snap` has no
# field for it, which is reset.rs:207-214's own admission one layer out. (3) The
# changePIN refusal of the CURRENT PIN (clientpin.rs:294-303) is not modelled —
# the module has no PIN VALUE to compare. (3b) The refusal is a DISABLED ACTION
# here, where the firmware refuses only after the ladder has spent a try, read
# the counter back and REFILLED it (clientpin.rs:740-816, pinned by
# clientpin_tests.rs:1249-1251) — so a refused-but-verified getPinToken has two
# EF_PIN writes in the code and no position at all in this model. (4) The
# BUILT-IN UV door (`getPinUvAuthTokenUsingUvWithPermissions`,
# clientpin.rs:493-495) carries the same refusal in the firmware and has no
# action in this module at all — `grep -n builtin RSKeySecurityState.tla` finds
# one comment and no transition — so the flag is modelled at the two
# get_pin_token doors, the changePIN clear and the reset sweep, and the third
# door is out of scope here rather than covered. (5) The PANEL's own clear
# (clientpin.rs:1260) is the same kind of gap: `store_local_pin` has no action.
covers = ["model:ForceChangeModelled"]
discharges = ["ForceChangeModelled"]
supports = ["SEC-FIDO-001", "SEC-FIDO-003"]

[[assumption]]
id = "PLAT-MODEL-011"
class = "model-abstraction"
statement = "`EF_DEVICE_PIN` is outside `RSKeySecurityState` because the SURFACE it gates is outside it, not because it is inert. It carries a second independent persistent retry ladder, and its host-visible reader is the PIN half of the vendor seed-export / attestation / audit gate — and neither that gate, the MSE channel, nor its `EF_PIN` half is modelled. For the RESET family the omission is sound on its own: it is a phase-2 gate record, phase 2 cannot begin until phase 1 has provably emptied the store, and the seed leads phase 1, so no prefix that drops it leaves a secret it could have gated."
discharge = "Model the vendor gate itself — MSE readiness plus the two-armed PIN factor — as a stage-4 action; `EF_DEVICE_PIN` then enters as one Boolean inside it, and its ladder can wait for a mutant that needs it. Until then this is an open scope obligation, not a proof."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: a device PIN the running build cannot collect waived that gate entirely until it was refused instead — the second factor on an irreversible vendor operation became a touch"
supports = ["SEC-FIDO-004", "SEC-FIDO-006C"]

[[assumption]]
id = "PLAT-MODEL-008"
class = "model-abstraction"
statement = "`DeviceUnlock` is WIDER than the firmware in two directions and both are sound: the model has no device lock, so it does not require the seed to be stored WRAPPED — only a locked device has an `EF_KEY_DEV_ENC` to open — and it omits `AUT_DISABLE`, which only ever CLEARS the RAM copy."
discharge = "Nothing to run: a wider action reaches a superset of states, so a safety invariant proved over the model holds of the firmware, and the omitted action removes only a way for the copy to disappear. What this row buys is not a discharge but a READER: the argument lived in a comment above the action in `formal/RSKeySecurityState.tla`, where no gate sees it, and stage 2 п.3 asks exactly for the move. It stops being sound the moment a LIVENESS or coverage claim is made over the same action, which is why the failure direction below is not `none`."
discharge_owner = "contributor"
status = "accepted-risk"
failure_direction = "coverage, not security: safety carries across a widening, and a liveness or dead-action claim over `DeviceUnlock` does not — the model can take a step the firmware cannot"
supports = [
  "SEC-FIDO-001",
  "SEC-FIDO-004",
  "SEC-FIDO-006",
  "SEC-FIDO-007",
  "SEC-FIDO-L01",
]

[[assumption]]
id = "PLAT-MODEL-003"
class = "model-abstraction"
statement = "The model's `ram` is `FidoState::keydev_dec.is_some()` and nothing else in the tree is a second copy of the seed the model would have to see."
discharge = "A recorded session that performs a vendor UNLOCK. The projection is written once — `crates/rsk-device/src/ctap.rs` maps the field into `keydev_ram_raw`, and `formal/TraceSecurity.tla`'s R4aRawRefinesB equates it with `ram` at every boundary — so the comparison exists; what is missing is a session in which it is ever TRUE. Measured: `keydev_ram_raw` is false in all 40 pre and all 40 post snapshots of formal/traces/security-phase4.jsonl, so the true arm has never run."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: the refinement's `ram` half is carried rather than checked, and a second RAM copy the projection does not see would be invisible to it"
refines = ["PLAT-TOOL-002"]
covers = ["slice:AS-RAM-1"]
supports = ["SEC-FIDO-007", "SEC-TRACE-001"]

[[assumption]]
id = "PLAT-MODEL-004"
class = "model-abstraction"
statement = "One `store.seed` boolean stands for two flash records, so the soft-locked device — `EF_KEY_DEV_ENC` present, `EF_KEY_DEV` gone — is a state the seed invariants cannot tell from an unlocked one."
discharge = "A second model variable, or a proof that the collapse preserves the invariants that read it. The code keeps the two apart already: `crates/rsk-fido/src/seed.rs` defines the lock as exactly `has_key(EF_KEY_DEV_ENC) && !has_key(EF_KEY_DEV)`, and `crates/rsk-fido/src/reset_assurance.rs` carries `owner_seed` and `owner_locked_seed` as separate fields; `formal/TraceSecurity.tla` is where they merge."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: the locked state is the one where the RAM copy is the only readable seed, which is exactly where SEC-FIDO-007 has content"
covers = ["slice:AS-RAM-2"]
supports = ["SEC-FIDO-007", "SEC-FIDO-006"]

[[assumption]]
id = "PLAT-MODEL-005"
class = "model-abstraction"
statement = "`DeviceUnlock`'s `store.seed` conjunct is what makes `RamNeverOutlivesFlashSeed` true, and the production unlock has no such conjunct — it gates on `mse_ready`, a 32-byte lock key and `lock_engaged`, which requires the PLAIN record ABSENT."
discharge = "A boolean model constant pinning the conjunct, emitted both ways by `formal/gen-configs.sh` — the shape `AlwaysUvShipped` already has — after which this row moves to `assurance/assumptions.toml` and stops being one of these. It is the only row of this set that could join the first registry, and the obstacle is writing the constant, not the gate. By construction the FALSE arm goes RED: `Idle and no flash seed and no RAM copy` is reachable through ResetAborts once ResetSweepSecrets has deleted the record."
discharge_owner = "contributor"
status = "pending"
failure_direction = "security: if the production unlock can mint the RAM copy with no live flash seed, the invariant is true of the model and false of the firmware"
depends_on = ["PLAT-MODEL-004"]
covers = ["slice:AS-RAM-3"]
supports = ["SEC-FIDO-007"]

[[assumption]]
id = "PLAT-MODEL-006"
class = "model-abstraction"
statement = "`RamNeverOutlivesFlashSeed` is INERT on the shipped configuration: it has no falsifying reachable state by construction, so its GREEN carries no information beyond PLAT-MODEL-005's guard."
discharge = "Not by a run — by a second reset producer. `formal/README.md` records the measurement: dropping SeedReachable's `ram` disjunct leaves the state set identical and flips no verdict, and two of the three `ram' = FALSE` assignments are dead. The page names what would make it bite — `Fs::factory_wipe`, the second reset path, still unmodelled — if its reboot were ever separated from the wipe."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: a GREEN nobody can turn red is a check that cannot fail, and everything that cites it inherits that"
covers = ["slice:AS-RAM-5"]
supports = ["SEC-FIDO-007"]

[[assumption]]
id = "PLAT-MODEL-007"
class = "model-abstraction"
statement = "The C-tier reset bridge cannot be reused as bounded evidence for the seed-ordering invariant: it is deliberately WIDER and admits the state the invariant forbids."
discharge = "Either a conjunct added to `crates/rsk-fido/src/reset_assurance.rs`'s `well_formed` — which changes what the four SEC-FIDO-006 harnesses prove and is stage 4's call — or a harness of this property's own. Today `well_formed` constrains `volatile.owner_seed` only while a reset is in progress, and `crates/rsk-fido/src/reset_refinement_kani.rs` draws it as a free `kani::any()` beside an equally free persistent seed, so all four harnesses run over states where the RAM copy outlives the flash record."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: `kani = 0` on this property is CORRECT rather than merely unfilled, and a reader who takes the neighbouring harnesses for coverage of it is wrong"
covers = ["slice:AS-RAM-8"]
supports = ["SEC-FIDO-007", "SEC-FIDO-006"]

[[assumption]]
id = "PLAT-MODEL-002"
class = "model-abstraction"
statement = "One credential per relying party is enough to carry the authorization and management properties; the shipped cardinality is `MAX_RESIDENT_CREDENTIALS`."
discharge = "The store slice of stage 5, which is where a cardinality argument can be made rather than assumed."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: a defect that needs two credentials of one RP — the enumerate/delete interleavings — is outside every configuration"
covers = ["slice:AS-AUTH-6"]
supports = ["SEC-FIDO-001", "SEC-FIDO-005"]

# --- the four inventory categories stage 10 names and this file did not hold ---
# `scripts/platform_gate.py`'s CLASSES vocabulary already had all four names and
# no row used any of them, so the exit form "no platform statement without an
# entry" was met over a set that did not contain them. None of the four is
# DERIVABLE today — the four derivations produce slice ids, model constants,
# board-only suites and `unsafe` sites, and a hardware peripheral is none of
# those — so these are hand-written with no `covers`, exactly like the six rows
# that already are. That is the honest shape and it is also the weakness: a
# category with no candidate source is a category this page cannot force.

[[assumption]]
id = "PLAT-TRNG-001"
class = "trng"
statement = "The RP2350's ring-oscillator TRNG delivers full-entropy words once its health check passes, so every key, nonce, blinding factor and pinUvAuthToken drawn after boot is unpredictable to a host."
discharge = "A board measurement of the raw source before whitening, on a known stepping and at the temperature and supply corners the datasheet qualifies — not a statistical test of the whitened output, which passes over a stuck source. The boot health check was raised 25 -> 1000 samples after a stall was measured, so the startup transient is the part that is known and the steady state is the part that is not."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security, and silently: a degraded source weakens every secret the device mints, and nothing downstream can notice"
supports = ["SEC-FIDO-003", "SEC-FIDO-008"]

[[assumption]]
id = "PLAT-TIMER-001"
class = "timers"
statement = "`embassy_time::Instant` is monotonic and makes progress, so a timeout measured against it expires."
discharge = "Reading the RP2350 timer's clock source against the boot configuration the image sets, plus a board run long enough to cross the counter's wrap. Every timeout claim rests on it — the presence window, the pinUvAuthToken's rolling inactivity and absolute caps, and the reset window CTAP 2.1 §6.6 bounds — and so do the three liveness properties, none of which names an assumption today."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "split: a clock that stops turns every timeout into a wedge (availability), and one that jumps forward retires a live grant early (usability). Neither direction opens a gate, which is why this is not a security row"
supports = ["SEC-FIDO-L01", "SEC-FIDO-L02", "SEC-FIDO-L03"]

[[assumption]]
id = "PLAT-XIP-001"
class = "multicore-xip"
statement = "Core 1 is paused for the whole of every flash erase or program, so no instruction is fetched from XIP while the array is unreadable, and the inter-core FIFO makes progress so the pause is released."
discharge = "A board measurement: core 1 executing from XIP across a store write, with the pause instrumented. `firmware/src/core1.rs` carries the two `unsafe` sites this rests on and `docs/unsafe.md` justifies them as Rust invariants — which is a different question from whether the silicon behaves as the pause assumes, and that difference is why this row is not `PLAT-TOOLCHAIN-002`'s."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "availability: a fetch from an unreadable array faults the core, which is a hang and not a bypass"
supports = ["SEC-STORE-002"]

[[assumption]]
id = "PLAT-DISPLAY-001"
class = "display"
statement = "A panel update completes before the firmware treats the card as shown, and the panel's orientation and geometry are the ones the hit test was computed for."
discharge = "A touch board: photograph the panel at the moment the ceremony arms, and drive each control at the coordinates the hit test claims. `crates/rsk-ui`'s render tests prove what the model would paint and nothing proves the panel painted it; the trusted-display properties are stated over the ceremony, not over the glass."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a card the user did not see, or a control at coordinates the user did not aim at, is a confirmation of an operation nobody read"
supports = ["SEC-DISP-001", "SEC-DISP-002", "SEC-DISP-003"]

[[assumption]]
id = "PLAT-TRACE-001"
class = "model-abstraction"
statement = "A trace-linked claim rests on the fields the recorded session VARIES; 35 of the committed trace's 81 fields are constant across all 40 events, and a conjunct whose antecedent is one of them was never exercised by the replay."
discharge = "Sessions that vary them, and there is no substitute: a conjunct is checked by the replay only where its antecedent is true somewhere in the recording. Measured on formal/traces/security-phase4.jsonl — `soft_lock_raw`, `warm_boot_raw`, `token_user_present_raw`, `persistent_grant_record`, `backup_sealed_record`, `seed_encrypted_record` and the four `cm_*_raw` counters are false or fixed in every event, and `token_user_present_raw` together with `soft_lock_raw` are the antecedents of BOTH conjuncts of NoAuthorizationBypass. Two members of this class already had rows of their own — PLAT-MODEL-003 for `keydev_ram_raw` and formal/README.md's paragraph for `builtin_uv` — and the class is what those two are instances of."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: a clause the recording never reaches is a clause the replay agrees with for free, and the agreement reads exactly like evidence"
supports = ["SEC-TRACE-001", "SEC-TRACE-002", "SEC-TRACE-004", "SEC-REF-004"]
