#
# The SECOND assumption registry: the ones no model constant can carry.
#
# `assurance/assumptions.toml` holds a Boolean TLA constant some configuration
# assigns both ways and some reachable definition reads. That shape is what makes
# a model assumption falsifiable — you discharge it by running the other arm —
# and it refuses everything here by construction: `M7-Q2` written there answers
# `in the registry but no configuration assigns it`, and so does a recorded board
# PASS, and so does `tools/emu` fidelity. A second FILE rather than a `class`
# field on the first, because the field would be a hand-written discriminator
# choosing which rules apply: measured, deleting `PowerOnClearsScratch2` from the
# first registry reddens it in one line, and a `class = "platform"` on that same
# entry would leave the orphan rule satisfied and the both-arms rule skipped.
#
# HAND-WRITTEN FIELDS ONLY: id, statement, class, discharge, discharge_owner,
# status, failure_direction, and the link lists. Which candidates exist is
# DERIVED by scripts/platform_gate.py from four sources and printed, never
# stored — the same rule properties.toml states, for the same reason.
#
# Read the `status` column first. **One of eighteen is discharged**, and the one
# that is was discharged by reading a manifest. Nothing here is evidence about
# anything yet; every row is an obligation with an owner and a named route, and
# ten of the routes end at a board this repository must not touch.

# ---- Reset and the boot ROM --------------------------------------------------

[[assumption]]
id = "PLAT-RESET-001"
class = "reset"
statement = "A real RP2350 power-on reset clears `WATCHDOG.scratch2`, so the PIN soft-lock the previous cycle recorded does not ride through it."
discharge = "A board measurement: write a known value to WATCHDOG.scratch2, cut power at the supply — not a warm reset, because firmware/src/pin_lock.rs writes the word on every CBOR dispatch, so the read must come from the first boot after — and read it back. tests/54_sram_residue.py is the shape; the register is not SRAM, so it needs its own probe."
discharge_owner = "maintainer"
status = "pending"
# Towards MORE locking, not less: a word that rides a power cycle carries the
# mismatch batch with it. The undefined-register case is a third possibility and
# is already handled — the tag makes garbage read as clear.
failure_direction = "usability: a soft lock that outlives the power cycle it was meant to end"
covers = ["slice:AS-AUTH-4", "model:PowerOnClearsScratch2"]
discharges = ["PowerOnClearsScratch2"]
supports = ["SEC-BOOT-001", "SEC-BOOT-002"]

[[assumption]]
id = "PLAT-ROM-001"
class = "boot-rom"
statement = "M7-Q2: the boot ROM's BOOTSEL return path leaves `WATCHDOG.scratch2` as the firmware left it, so a drop to the bootloader is not a way to shed the soft lock."
discharge = "A board measurement on the same rig as PLAT-RESET-001, with the vendor applet's reboot-to-BOOTSEL in place of the supply cut, and the read taken on the boot after the bootloader is left. No datasheet clause states it either way; a vendor erratum would settle it as well."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a host that can reach the vendor AID could clear a soft lock the retry ladder imposed"
# The measurement cannot be taken until the drop itself is known to work, which
# is the other row's whole content.
depends_on = ["PLAT-ROM-002"]
supports = ["SEC-BOOT-001", "SEC-BOOT-002"]

[[assumption]]
id = "PLAT-ROM-002"
class = "boot-rom"
statement = "The vendor applet's reboot really reaches the bootloader: `tests/51_secure_reboot.py` has no runner in this tree, because the emulator has no bootloader to fall into."
discharge = "A run of tests/51_secure_reboot.py against a no-touch board, with the resulting log kept beside this registry."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "availability: a reboot that lands nowhere leaves a key that cannot be updated in the field"
covers = ["board-only:51_secure_reboot"]
supports = ["SEC-ADM-001"]

[[assumption]]
id = "PLAT-MEM-001"
class = "memory"
statement = "SRAM does not survive the drop to BOOTSEL, so a seed unwrapped in RAM is not readable through the bootloader."
discharge = "A run of tests/54_sram_residue.py against a board — the write-back probe is what tells `cleared` from `unreadable` — with its log kept."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a plaintext seed readable over the bootloader's mass-storage interface"
depends_on = ["PLAT-ROM-002"]
covers = ["board-only:54_sram_residue"]
supports = ["SEC-FIDO-007"]

# ---- Flash, OTP and the input path -------------------------------------------

[[assumption]]
id = "PLAT-FLASH-001"
class = "flash"
statement = "The silicon's program/erase tear behaviour under a real supply cut is the one the store model assumes: a torn write leaves the old record or a detectably bad one, never a plausible wrong one."
discharge = "A recorded PASS of tests/29_reset_power_cut.py on a throwaway board with a real supply cut. formal/README.md already says it in as many words: the HIL column records an OWNED test, not a claim that a board run passed."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a reset interrupted mid-write could leave a credential live with its gate gone"
covers = ["board-only:29_reset_power_cut"]
supports = [
  "SEC-FIDO-006",
  "SEC-FIDO-006A",
  "SEC-FIDO-006B",
  "SEC-FIDO-006C",
  "SEC-STORE-001",
  "SEC-STORE-002",
  "SEC-STORE-003",
  "SEC-STORE-004",
  "SEC-STORE-005",
  "SEC-STORE-006",
]

[[assumption]]
id = "PLAT-OTP-001"
class = "otp"
statement = "OTP read permissions, lock state and the chaffing layout behave as the datasheet describes across a partial MKEK provisioning, so a half-written fuse row is refused rather than read as a key."
discharge = "A run of tests/90_otp_mkek_migration.py on a board whose fuses are expendable. Irreversible by construction — AGENTS.md puts fuse writes with the maintainer and nowhere else."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a derivation that silently succeeds on the wrong key material, which a FAKE_MKEK board already mimics"
covers = ["board-only:90_otp_mkek_migration"]

[[assumption]]
id = "PLAT-INPUT-001"
class = "input"
statement = "A PC/SC reader's `FEATURE_VERIFY_PIN_DIRECT` layer carries the PIN to the card without the host seeing it, so the pinpad path spends the same retry budget the CCID path does."
discharge = "A run of tests/53_ccid_pinpad.py against a board through a real PC/SC stack; the emulator's socket has no reader layer to exercise."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: a verify that does not reach the retry ladder is an unmetered guessing channel"
covers = ["board-only:53_ccid_pinpad"]
supports = ["SEC-LAT-002"]

# ---- The tools the evidence is taken with ------------------------------------

[[assumption]]
id = "PLAT-TOOL-001"
class = "tool-fidelity"
statement = "A green `tools/emu` run is a protocol result, not a device result: the emulator's own README enumerates what it does not emulate — secure boot, fuses, the anti-rollback epoch, the partition table, glitch detectors, side channels, the TRNG, the flash medium's physics, USB packetisation and the worker's sequencing."
discharge = "Not dischargeable as written — it is the standing scope of every emulator result. It shrinks when a named half moves into the shared crates, the way the applet wiring and the flash backend already did."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: a suite that passes here and would not on a board, in whichever half is still written twice"

[[assumption]]
id = "PLAT-TOOL-002"
class = "tool-fidelity"
statement = "`tools/emu` implements the same authorization gates as the firmware, so a recorded session is evidence about the firmware."
discharge = "A board recording of the same session, compared boundary by boundary against formal/traces/security-phase4.jsonl."
discharge_owner = "maintainer"
status = "pending"
failure_direction = "security: every trace-linked claim is about the emulator until this is measured"
# The narrow half of the row above: the broad statement is about the whole
# device, this one is about the gates the recorded sessions are replayed for.
refines = ["PLAT-TOOL-001"]
covers = ["slice:AS-AUTH-1"]
supports = [
  "SEC-REF-004",
  "SEC-TRACE-001",
  "SEC-TRACE-002",
  "SEC-TRACE-004",
  "SEC-SEAM-001",
  "SEC-SEAM-002",
  "SEC-SEAM-003",
  "SEC-SEAM-004",
  "SEC-SEAM-005",
  "SEC-SEAM-006",
]

[[assumption]]
id = "PLAT-TOOL-003"
class = "tool-tcb"
statement = "Kani/CBMC is sound for the arithmetic its harnesses bound, and the solver that ran is the pinned one."
discharge = "A pinned toolchain and a recorded tool hash on the bundle. cargo-kani is the one tool on this path the flake does not pin at all — that is the gap, not the soundness argument."
discharge_owner = "contributor"
status = "pending"
failure_direction = "coverage: every BOUNDED row rests on a solver nobody recorded"
covers = ["slice:AS-AUTH-7"]
supports = [
  "SEC-FIDO-001",
  "SEC-FIDO-002",
  "SEC-FIDO-003",
  "SEC-FIDO-006",
  "SEC-STORE-002",
  "SEC-TRANS-001",
