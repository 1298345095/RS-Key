  "unsafe:firmware/build.rs",
  "unsafe:firmware/src/core1.rs",
  "unsafe:firmware/src/main.rs",
  "unsafe:firmware/src/presence.rs",
  "unsafe:fuzz/tests/miri.rs",
  "unsafe:rsk-wipe/build.rs",
