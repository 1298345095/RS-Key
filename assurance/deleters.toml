#
# The delete-family caller dispositions. `Fs::delete`, `Fs::delete_key`,
# `Fs::force_delete` and `Fs::force_delete_halves` each remove the value whatever
# their EF_META drop did, and each RETURNS what that drop did: `Err` names a state
# — the value is gone and a record may still stand over it — rather than a no-op.
# The last spelling hands the two answers back apart, because a reset sweep must
# stop on one and carry the other to the end of its range. So every caller makes a
# decision, and this file is where the decision is written down.
#
# NOT a roster. `scripts/deleter_gate.py` derives which sites exist, which verb
# each calls and whether each reads or discards the answer, and holds this file
# to that in both directions. What is stored here is only the judgement a script
# cannot make: which class the site is in, whether the fid can carry an EF_META
# head, whether discarding is allowed there, and why. A ledger written from
# memory is what `assurance/crates.toml`'s header records going wrong, and the
# audit this file comes out of began by refuting a sentence in
# docs/store-refinement.md that named "the one caller in the tree that deletes a
# fid carrying a head" — there were two, and the second was hiding a faulted
# drop on the reset path.
#
# Scope, matching the roadmap's §3.4 so the counts reproduce: callers outside
# `crates/rsk-fs` (which defines the family), outside `fuzz/`, and outside the
# cfg-gated `*_tests.rs` / `*_kani.rs` sources. That leaves 43 — 24 `delete`,
# 9 `delete_key`, 5 `force_delete`, 5 `force_delete_halves`. The one in-crate
# caller left out by the scope rule is `rsk-fs`'s own `request_rescrub`
# (`lib.rs`), which re-arms the at-rest scrub marker and is best-effort for the
# reason `init.rs`'s pair below are: the next boot runs it again.
#
# class
#   wipe-sweep     a batched reset/factory-wipe phase, with a delete budget and
#                  a two-phase order carrying the security property
#   secret-or-gate the record is a secret or an authorization/policy gate; a
#                  survivor changes what the device will do or hand over
#   metadata       the site deletes a fid that carries an EF_META head, and the
#                  head is the point
#   bookkeeping    an index, cache, label or public object; a survivor costs a
#                  re-derivation, not a decision
#
# metadata
#   drops-head     the fid can carry an EF_META head and the drop must go with
#                  the value. The three `delete` spellings' postconditions differ
#                  nowhere else, so this is the axis §5A п.6 asks each site to
#                  name
#   none           the fid carries no head — heads are minted on PIV key fids
#                  alone (`head_minters` below, derived), so the metadata half
#                  of the answer is vacuous at this site
#
# disposition
#   must-read      the answer is load-bearing here; the site reads it
#   best-effort    discarding is allowed here, and `why` says what makes it so
#
# `answer` is DERIVED, not decided: it says what the statement actually does
# with the `Result`. It is in the file so that a site changing from one to the
# other cannot pass as an unrelated edit — the gate compares them and requires
# the disposition to agree.

# The crates that write an EF_META head, derived by the gate. Every `drops-head`
# disposition rests on this being one crate; a second minter arriving silently
# is how that premise stops holding while every entry still reads as if it does.
head_minters = ["crates/rsk-piv"]


